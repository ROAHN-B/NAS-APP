<!-- Capacitor Plugin Imports & Logic -->
  <script type="module">
    import { AndroidForegroundService } from '@capawesome-team/capacitor-android-foreground-service';
    import { CapacitorNodeJS } from '@capawesome/capacitor-nodejs';

    // Automatically start the embedded Node.js backend when app launches
    async function startNodeBackend() {
      try {
        await CapacitorNodeJS.start({ 
          // If your node files are in public/node or root nodejs folder, 
          // ensure the engine is pointed to the correct startup script
        });
        console.log('Embedded Node.js server started.');
      } catch (err) {
        console.error('Node backend start error:', err);
      }
    }
    startNodeBackend();

    // Make functions globally available to HTML onclick bindings
    window.startTunnel = async function() {
      try {
        const permResult = await AndroidForegroundService.checkPermissions();
        if (permResult.display !== 'granted') {
          await AndroidForegroundService.requestPermissions();
        }

        await AndroidForegroundService.startForegroundService({
          title: 'NAS Tunnel Active',
          body: 'Your network storage service is running in the background.',
          id: 999,
          smallIcon: 'ic_stat_icon_config_sample'
        });

        const res = await fetch('http://localhost:5050/api/tunnel/start', { method: 'POST' });
        const data = await res.json();
        console.log(data);
        updateStatus(true);
      } catch (err) {
        console.error('Failed to start service/tunnel:', err);
        alert('Error starting tunnel: ' + err.message);
      }
    };

    window.stopTunnel = async function() {
      try {
        await AndroidForegroundService.stopForegroundService();
        await fetch('http://localhost:5050/api/tunnel/stop', { method: 'POST' });
        updateStatus(false);
      } catch (err) {
        console.error('Failed to stop service/tunnel:', err);
      }
    };
  </script>
