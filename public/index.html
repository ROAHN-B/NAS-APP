<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rohan's NAS Command Hub</title>
  <style>
    :root { --bg: #0b0f19; --card: #111827; --text: #f3f4f6; --primary: #3b82f6; --primary-hover: #2563eb; --border: #374151; }
    body { background-color: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 400px; margin: 0 auto; }
    .card { background: var(--card); border-radius: 12px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { text-align: center; margin-top: 0; }
    p.subtitle { color: #9ca3af; text-align: center; font-size: 14px; margin-bottom: 24px; }
    input[type="text"], input[type="password"] { width: 100%; padding: 12px; margin-bottom: 16px; background: #1f2937; border: 1px solid var(--border); border-radius: 8px; color: white; box-sizing: border-box; font-size: 14px; }
    input[type="text"].mono { font-family: monospace; font-size: 12px; }
    button { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; font-size: 16px; cursor: pointer; transition: background 0.2s; }
    button:hover { background: var(--primary-hover); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .file-drop { border: 2px dashed var(--border); border-radius: 8px; padding: 30px 20px; text-align: center; background: #1f2937; position: relative; margin-bottom: 20px; }
    .file-drop input[type="file"] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    .status { margin-top: 16px; padding: 12px; border-radius: 8px; background: #1f2937; text-align: center; font-size: 14px; display: none; white-space: pre-wrap; word-break: break-all; }
    
    /* View Toggling */
    #dashboard-view { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <!-- LOGIN VIEW -->
    <div class="card" id="login-view">
      <h2>NAS Command Hub</h2>
      <p class="subtitle">Secure Authentication</p>
      <input type="text" id="username" placeholder="Username" />
      <input type="password" id="password" placeholder="Password" />
      <button id="loginBtn">Sign In</button>
      <div id="loginStatus" class="status"></div>
    </div>

    <!-- DASHBOARD VIEW -->
    <div class="card" id="dashboard-view">
      <h2>SD Card Decryptor</h2>
      <p class="subtitle">Select an encrypted file from your SD card.</p>
      
      <input type="text" id="aesKey" class="mono" value="0x2B, 0x7E, 0x15, 0x16, 0x28, 0xAE, 0xD2, 0xA6, 0xAB, 0xF7, 0x15, 0x88, 0x09, 0xCF, 0x4F, 0x3C" placeholder="AES Key (Hex)" />
      
      <div class="file-drop">
        <input type="file" id="fileInput" />
        <span id="fileLabel" style="color: #9ca3af;">Drop file here or tap to browse</span>
      </div>

      <button id="decryptBtn">Decrypt & Download</button>
      <div id="decryptStatus" class="status"></div>
    </div>
  </div>

  <script>
    const API_BASE = 'https://media-server.app';
    
    // UI Elements
    const loginView = document.getElementById('login-view');
    const dashboardView = document.getElementById('dashboard-view');
    const loginStatus = document.getElementById('loginStatus');
    const decryptStatus = document.getElementById('decryptStatus');
    
    // Check for existing session
    if (localStorage.getItem('nas_token')) {
      loginView.style.display = 'none';
      dashboardView.style.display = 'block';
    }

    // --- LOGIN LOGIC ---
    document.getElementById('loginBtn').addEventListener('click', async () => {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      
      btn.innerText = "Authenticating...";
      try {
        const res = await fetch(`${API_BASE}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();
        
        if (data.success) {
          localStorage.setItem('nas_token', data.token);
          loginView.style.display = 'none';
          dashboardView.style.display = 'block';
        } else {
          loginStatus.style.display = 'block';
          loginStatus.style.color = '#ef4444'; // Red
          loginStatus.innerText = data.error || 'Invalid credentials';
        }
      } catch (err) {
        loginStatus.style.display = 'block';
        loginStatus.innerText = "Network Error. Is the backend running?";
      } finally {
        btn.innerText = "Sign In";
      }
    });

    // --- DECRYPTOR LOGIC ---
    document.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        document.getElementById('fileLabel').innerText = `${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
        document.getElementById('fileLabel').style.color = '#3b82f6';
      }
    });

    document.getElementById('decryptBtn').addEventListener('click', async () => {
      const fileInput = document.getElementById('fileInput');
      const aesKey = document.getElementById('aesKey').value;
      const btn = document.getElementById('decryptBtn');
      
      if (!fileInput.files.length) return alert("Please select a file.");
      if (!aesKey) return alert("Please enter the AES key.");

      const file = fileInput.files[0];
      btn.innerText = "Decrypting...";
      btn.disabled = true;
      decryptStatus.style.display = 'block';
      decryptStatus.innerText = "Extracting binary stream...";

      try {
        // 1. EXTRACT RAW BUFFER (Prevents file corruption)
        const rawBuffer = await file.arrayBuffer();

        // 2. SEND TO BACKEND WITH TOKEN
        const response = await fetch(`${API_BASE}/api/decrypt`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/octet-stream',
            'X-AES-Key': aesKey,
            'X-File-Name': file.name,
            'Authorization': `Bearer ${localStorage.getItem('nas_token')}`
          },
          body: rawBuffer
        });

        const data = await response.json();

        if (data.success) {
          decryptStatus.style.color = '#10b981'; // Green
          decryptStatus.innerText = `Success!\nSaved to:\n${data.savedPath}`;
        } else {
          decryptStatus.style.color = '#ef4444'; // Red
          decryptStatus.innerText = `Error: ${data.error}`;
        }
      } catch (err) {
        decryptStatus.style.color = '#ef4444';
        decryptStatus.innerText = "Network error processing file.";
        console.error(err);
      } finally {
        btn.innerText = "Decrypt & Download";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
